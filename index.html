<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Roblox API User Info Example</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 1.5rem;
    background: linear-gradient(135deg, #4a90e2, #50e3c2);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .container {
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 350px;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  h1 {
    margin-top: 0;
    margin-bottom: 1rem;
    font-weight: 700;
    font-size: 1.5rem;
    text-align: center;
  }
  label {
    font-weight: 600;
  }
  input[type="number"] {
    width: 100%;
    padding: 0.5rem;
    margin: 0.5rem 0 1rem 0;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    border: none;
    border-radius: 6px;
    background-color: #1abc9c;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:disabled {
    background-color: #555;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background-color: #16a085;
  }
  .result {
    margin-top: 1.5rem;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 1rem;
    font-size: 0.95rem;
  }
  .error {
    margin-top: 1rem;
    background: #e74c3c;
    color: white;
    padding: 1rem;
    border-radius: 8px;
    font-weight: 600;
  }
  @media (max-width: 400px) {
    body {
      padding: 1rem;
    }
    .container {
      padding: 1rem;
    }
  }
</style>
</head>
<body>
  <div class="container" role="main">
    <h1>Roblox User Info Lookup</h1>
    <form id="userForm" aria-label="Roblox user ID form">
      <label for="userIdInput">Enter Roblox User ID:</label>
      <input type="number" id="userIdInput" name="userId" min="1" required aria-required="true" aria-describedby="userIdDesc" placeholder="e.g., 1" />
      <small id="userIdDesc">User ID must be a positive integer.</small>
      <button type="submit" id="fetchButton">Fetch User Info</button>
    </form>
    <div id="result" class="result" aria-live="polite" aria-atomic="true" hidden></div>
    <div id="error" class="error" aria-live="assertive" role="alert" hidden></div>
  </div>
<script>
  (() => {
    const form = document.getElementById('userForm');
    const userIdInput = document.getElementById('userIdInput');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('error');
    const fetchButton = document.getElementById('fetchButton');

    function clearMessages() {
      resultDiv.hidden = true;
      resultDiv.textContent = '';
      errorDiv.hidden = true;
      errorDiv.textContent = '';
    }

    function displayResult(user) {
      const createdDate = new Date(user.created);
      const createdDateStr = createdDate.toLocaleDateString() + ' ' + createdDate.toLocaleTimeString();
      resultDiv.innerHTML = `
        <p><strong>Username:</strong> ${user.name}</p>
        <p><strong>Display Name:</strong> ${user.displayName || '(none)'}</p>
        <p><strong>Description:</strong> ${user.description || '(no description)'}</p>
        <p><strong>Account Created On:</strong> ${createdDateStr}</p>
      `;
      resultDiv.hidden = false;
    }

    function displayError(message) {
      errorDiv.textContent = message;
      errorDiv.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();
      const userId = userIdInput.value.trim();
      if (!userId || isNaN(userId) || Number(userId) < 1) {
        displayError('Please enter a valid Roblox User ID (positive integer).');
        return;
      }

      fetchButton.disabled = true;
      fetchButton.textContent = 'Fetching...';

      try {
        const response = await fetch(`https://users.roblox.com/v1/users/${userId}`);
        if (!response.ok) {
          if(response.status === 404) {
            throw new Error('User not found. Please check the User ID.');
          }
          throw new Error('Failed to fetch data from Roblox API.');
        }
        const userData = await response.json();
        displayResult(userData);
      } catch (err) {
        displayError(err.message);
      } finally {
        fetchButton.disabled = false;
        fetchButton.textContent = 'Fetch User Info';
      }
    });
  })();
</script>
</body>
</html>
